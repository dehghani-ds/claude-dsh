<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Workbench</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16.0 13.8L16.0 2.8M17.2 14.2L22.4 6.5M17.8 14.8L27.4 8.6M18.2 16.1L28.0 16.4M18.0 17.0L27.7 21.7M17.0 18.0L21.1 26.0M16.0 18.2L15.8 29.8M15.0 17.9L10.5 26.4M14.0 17.0L4.5 21.6M13.8 16.1L4.4 16.6M14.1 14.8L4.6 8.9M14.9 14.1L9.7 5.5' stroke='%23D97757' stroke-width='3.4' stroke-linecap='round' fill='none'/><circle cx='16' cy='16' r='3.4' fill='%23D97757'/></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --panel2:#f1efea; --border:#e2dfd8; --text:#1f1e1c; --muted:#6f6b63;
  --accent:#c96442; --accent-weak:#f5e4dc; --ok:#2f7d4f; --warn:#a4661a; --err:#b3372f;
  --code:#f3f1ec; --user:#efe9df;
  --user-bg:#f7dccf; --user-fg:#2e160c; --user-border:#e3a489; --user-shadow:0 2px 6px rgba(201,100,66,.18);
  --term-bg:#262522; --term-fg:#f1efe9; --term-border:#3b3935; --term-dim:#b9b4aa; --term-accent:#f0a07f; --term-err:#f28b82; --shadow:0 1px 2px rgba(0,0,0,.05);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --panel:#22211f; --panel2:#2a2926; --border:#3a3834; --text:#ecebe8; --muted:#a19d95;
  --accent:#e0896a; --accent-weak:#3d2a22; --ok:#6cc08f; --warn:#e0a85a; --err:#ef7d74;
  --code:#2c2b28; --user:#2f2c27;
  --user-bg:#4a2e22; --user-fg:#fbeee7; --user-border:#8a5540; --user-shadow:0 2px 8px rgba(0,0,0,.35);
  --term-bg:#121110; --term-fg:#ecebe8; --term-border:#34322e; --term-dim:#a8a399; --term-accent:#e0896a; --term-err:#ef7d74; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --panel:#22211f; --panel2:#2a2926; --border:#3a3834; --text:#ecebe8; --muted:#a19d95;
  --accent:#e0896a; --accent-weak:#3d2a22; --ok:#6cc08f; --warn:#e0a85a; --err:#ef7d74;
  --code:#2c2b28; --user:#2f2c27;
  --user-bg:#4a2e22; --user-fg:#fbeee7; --user-border:#8a5540; --user-shadow:0 2px 8px rgba(0,0,0,.35);
  --term-bg:#121110; --term-fg:#ecebe8; --term-border:#34322e; --term-dim:#a8a399; --term-accent:#e0896a; --term-err:#ef7d74; --shadow:none;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;grid-template-columns:280px 340px 1fr;height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--border);background:var(--panel);border-radius:7px;padding:5px 10px}
button:hover{background:var(--panel2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.05)}
button.danger{color:var(--err)}
button.ghost{border-color:transparent;background:transparent;padding:3px 6px;color:var(--muted)}
button.ghost:hover{background:var(--panel2);color:var(--text)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:6px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.col{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border)}
.col-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
.col-head h2{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{overflow:auto;flex:1;min-height:0}
.search{margin:10px 12px 4px;width:calc(100% - 24px)}
.item{padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.item:hover{background:var(--panel2)}
.item.active{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.item .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;background:var(--panel2);color:var(--muted);
  border:1px solid var(--border);margin-left:4px;vertical-align:1px}
.badge.wt{color:var(--accent);border-color:var(--accent)}
.badge.dirty{color:var(--warn);border-color:var(--warn)}
.badge.gone{color:var(--err);border-color:var(--err)}
#left{background:var(--panel)}
#mid{background:var(--bg)}
.brand{font-weight:700;font-size:15px;flex:1}
.brand span{color:var(--accent)}
section.wt{border-bottom:1px solid var(--border);padding:10px 12px;background:var(--panel)}
section.wt summary{cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.wt-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--border)}
.wt-row:last-child{border-bottom:0}
.wt-row .info{flex:1;min-width:0}
.wt-row .info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-size:12px;color:var(--muted)}
.form-err{font-size:12px;color:var(--err);min-height:1em}
.summary{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.summary dt{color:var(--muted)}
.summary dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-all}
.note{font-size:12px;border-radius:7px;padding:7px 10px;background:var(--panel2);border:1px solid var(--border)}
.note.warn{color:var(--warn);border-color:var(--warn)}
.check{display:flex;gap:6px;align-items:center;font-size:13px}
/* chat */
#chat{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
#chat .col-head{background:var(--panel)}
#chatTitle{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatSub{font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msgs{flex:1;overflow:auto;padding:18px 0}
.msg{max-width:860px;margin:0 auto 14px;padding:0 22px}
.msg .role{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;
  display:flex;align-items:center;gap:6px}
.msg.assistant .role::before{content:"✳";color:var(--accent);font-size:13px}
/* your messages: right-aligned accent bubble */
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .role{color:var(--accent)}
.msg.user .role::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.msg.user .bubble{max-width:min(88%,720px);background:var(--user-bg);color:var(--user-fg);border:1px solid var(--user-border);
  border-radius:14px 14px 4px 14px;padding:10px 14px;white-space:pre-wrap;word-wrap:break-word;box-shadow:var(--user-shadow);font-size:14.5px}
.bubble details.paste{margin:6px 0;border:1px dashed var(--user-border);border-radius:8px;background:color-mix(in srgb,var(--panel) 60%,transparent);white-space:normal}
.bubble details.paste summary{cursor:pointer;padding:4px 8px;font-size:12px;color:var(--accent);font-weight:600}
.bubble details.paste pre{margin:0;padding:6px 10px 8px;font:12px/1.45 var(--mono);white-space:pre-wrap;max-height:300px;overflow:auto;color:var(--text)}
/* your commands: terminal block (dark in both themes) */
.term{width:min(88%,720px);background:var(--term-bg);color:var(--term-fg);border:1px solid var(--term-border);border-left:3px solid var(--term-accent);border-radius:10px 10px 4px 10px;
  font:13px/1.5 var(--mono);overflow:hidden;box-shadow:var(--user-shadow)}
.term .line{padding:8px 12px;display:flex;gap:8px;white-space:pre-wrap;word-break:break-word}
.term .ps{color:var(--term-accent);font-weight:700;user-select:none;flex:none}
.term .kind{margin-left:auto;flex:none;font:600 10px/18px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--term-dim);
  border:1px solid var(--term-border);border-radius:5px;padding:0 5px;height:18px}
.term .out{background:transparent;border:0;border-radius:0;border-top:1px solid var(--term-border);padding:7px 12px;margin:0;white-space:pre-wrap;word-break:break-word;color:var(--term-dim);
  max-height:320px;overflow:auto;font:12px/1.45 var(--mono)}
.term .out.err{color:var(--term-err)}
.term details summary{padding:0 12px 8px;cursor:pointer;color:var(--term-dim);font:12px system-ui,sans-serif}
.term details pre{margin:0;padding:0 12px 10px;white-space:pre-wrap;color:var(--term-dim);font-size:12px;max-height:300px;overflow:auto}
.notice{max-width:860px;margin:0 auto 14px;padding:0 22px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.notice::before{content:"";flex:1;height:1px;background:var(--border)}
.notice::after{content:"";flex:1;height:1px;background:var(--border)}
.md{word-wrap:break-word}
.md p{margin:.4em 0}
.md pre,pre.out{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:10px;overflow:auto;font:12.5px/1.45 var(--mono);white-space:pre}
.md code{font-family:var(--mono);font-size:.92em;background:var(--code);padding:1px 4px;border-radius:4px}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse}.md td,.md th{border:1px solid var(--border);padding:4px 8px}
details.tool{border:1px solid var(--border);border-radius:8px;background:var(--panel);margin:6px 0}
details.tool>summary{padding:6px 10px;cursor:pointer;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.tool>summary b{color:var(--text);font-family:var(--mono);font-weight:600}
details.tool .body{padding:0 10px 10px}
details.tool pre.out{max-height:360px;margin:6px 0 0;white-space:pre-wrap}
details.tool.err>summary{color:var(--err)}
details.think{color:var(--muted);font-size:13px;margin:4px 0}
details.think summary{cursor:pointer}
details.think div{white-space:pre-wrap;border-left:2px solid var(--border);padding-left:10px}
.meta-line{max-width:860px;margin:0 auto 14px;padding:0 22px;font-size:12px;color:var(--muted)}
.errbox{color:var(--err);white-space:pre-wrap;font-family:var(--mono);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:40px 20px}
.composer{border-top:1px solid var(--border);background:var(--panel);padding:10px 14px}
.composer-inner{max-width:860px;margin:0 auto}
#prompt{width:100%;resize:none;min-height:60px;max-height:260px;border-radius:10px;padding:10px 12px}
.bar{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.bar .sp{flex:1}
.bar label{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
dialog{border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text);padding:0;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
.dlg-head input{flex:1;font-family:var(--mono);font-size:12px}
.dlg-list{max-height:50vh;overflow:auto}
.dlg-list div{padding:6px 16px;cursor:pointer}.dlg-list div:hover{background:var(--panel2)}
.dlg-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
/* groups & tags */
:root{--c-slate:#64748b;--c-red:#d0463b;--c-orange:#d9731f;--c-amber:#b88a0e;--c-green:#2f8a55;--c-teal:#138a8a;--c-blue:#3569d4;--c-violet:#7c4dd6;--c-pink:#c7427f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-slate:#94a3b8;--c-red:#f07b72;--c-orange:#f2a05c;--c-amber:#e3c052;--c-green:#6cc08f;--c-teal:#4fc4c4;--c-blue:#7ea3f2;--c-violet:#b095f0;--c-pink:#ec8bb8}}
:root[data-theme="dark"]{--c-slate:#94a3b8;--c-red:#f07b72;--c-orange:#f2a05c;--c-amber:#e3c052;--c-green:#6cc08f;--c-teal:#4fc4c4;--c-blue:#7ea3f2;--c-violet:#b095f0;--c-pink:#ec8bb8}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;line-height:18px;padding:0 7px;border-radius:9px;
  color:var(--cc);border:1px solid color-mix(in srgb,var(--cc) 45%,transparent);background:color-mix(in srgb,var(--cc) 12%,transparent);
  white-space:nowrap;cursor:pointer;user-select:none}
.chip.on{background:var(--cc);color:var(--panel);border-color:var(--cc)}
.chip .x{opacity:.7;cursor:pointer}.chip .x:hover{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
#tagFilter{padding:0 12px 8px;display:flex;flex-wrap:wrap;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--cc);display:inline-block;flex:none}
.group-head{display:flex;align-items:center;gap:7px;padding:8px 14px 6px;font-size:12px;font-weight:650;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);cursor:pointer;position:sticky;top:0;background:var(--panel);z-index:1;border-bottom:1px solid var(--border)}
.group-head .n{font-weight:400;margin-left:auto}
.group-head .caret{transition:transform .15s;font-size:10px}
.group.collapsed .caret{transform:rotate(-90deg)}
.group.collapsed .group-body{display:none}
.group.drop .group-head{background:var(--accent-weak);color:var(--accent)}
.item{position:relative}
.item .edit{position:absolute;right:8px;top:7px;opacity:0}
.item:hover .edit,.item:focus-within .edit{opacity:1}
@media (hover:none){.item .edit{opacity:1}}
.item.dragging{opacity:.4}
.dlg-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;max-height:65vh;overflow:auto}
.dlg-body h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12px;color:var(--muted)}
.tag-input{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid var(--border);border-radius:7px;padding:5px;background:var(--panel)}
.tag-input input{border:0;flex:1;min-width:120px;padding:2px 4px}
.mrow{display:flex;gap:6px;align-items:center}
.mrow input{flex:1;min-width:0}
.mrow select{width:92px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:80vw}
#toast.show{opacity:1}
/* scrollbars: thin, rounded, theme-aware; brighter while hovering the scroll area, accent while dragging */
:root{--sb-rest:color-mix(in srgb,var(--muted) 18%,transparent);--sb-thumb:color-mix(in srgb,var(--muted) 38%,transparent);--sb-thumb-hover:color-mix(in srgb,var(--muted) 60%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb-rest);border-radius:10px;border:3px solid transparent;background-clip:padding-box;min-height:40px}
*:hover::-webkit-scrollbar-thumb{background-color:var(--sb-thumb)}
::-webkit-scrollbar-thumb:hover{background-color:var(--sb-thumb-hover)!important;border-width:2px}
::-webkit-scrollbar-thumb:active{background-color:var(--accent)!important}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none}
.term ::-webkit-scrollbar-thumb,.term::-webkit-scrollbar-thumb{background-color:color-mix(in srgb,var(--term-dim) 35%,transparent)}
@supports not selector(::-webkit-scrollbar){
  *{scrollbar-width:thin;scrollbar-color:var(--sb-rest) transparent}
  *:hover{scrollbar-color:var(--sb-thumb) transparent}
  .term,.term *{scrollbar-color:color-mix(in srgb,var(--term-dim) 45%,transparent) transparent}
}
/* scrollbars on the left: rtl puts the bar on the left side, children switch back to normal ltr text */
.scroll,#msgs,.news-list,.dlg-list,.dlg-body{direction:rtl}
.scroll>*,#msgs>*,.news-list>*,.dlg-list>*,.dlg-body>*{direction:ltr}
/* news inbox */
.bell{position:relative}
.bell .count{position:absolute;top:-4px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);
  color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center}
.news-banner{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--accent-weak);border-bottom:1px solid var(--user-border);
  color:var(--text);font-size:13px}
.news-banner b{color:var(--accent)}
.news-banner .sp{flex:1}
#newsDlg{width:min(860px,96vw)}
.news-tools{display:flex;gap:6px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.news-tools .tabs{display:flex;gap:2px;background:var(--panel2);border-radius:8px;padding:2px}
.news-tools .tabs button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:13px}
.news-tools .tabs button.on{background:var(--panel);box-shadow:var(--shadow);font-weight:600}
.news-tools .sp{flex:1}
.news-meta{font-size:12px;color:var(--muted);padding:0 16px 8px}
.news-list{max-height:62vh;overflow:auto;padding:4px 16px 16px}
.ncard{border:1px solid var(--border);border-radius:10px;margin-top:8px;background:var(--panel)}
.ncard.unread{border-color:var(--user-border);box-shadow:inset 3px 0 0 var(--accent)}
.ncard .nhead{display:flex;gap:8px;align-items:center;padding:9px 12px;cursor:pointer}
.news-select{display:flex;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;min-height:46px}
.news-select .sp{flex:1}
.news-select .batch{display:flex;gap:6px;flex-wrap:wrap}
.news-select .check{font-size:13px;cursor:pointer}
.nsel{margin:0;flex:none;cursor:pointer;accent-color:var(--accent);width:15px;height:15px}
.ncard.selected{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.ncard .ndel{opacity:0;padding:2px 6px;flex:none}
.ncard .nhead:hover .ndel,.ncard .ndel:focus-visible{opacity:1}
@media (hover:none){.ncard .ndel{opacity:1}}
#toast.action{pointer-events:auto;display:flex;gap:12px;align-items:center}
#toast.action button{background:transparent;border:1px solid currentColor;color:inherit;padding:2px 10px;font-weight:600}
.ncard .ndot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.ncard:not(.unread) .ndot{background:transparent;border:1px solid var(--border)}
.ncard .ntitle{flex:1;min-width:0;font-weight:500}
.ncard.unread .ntitle{font-weight:700}
.ncard .ndate{font-size:12px;color:var(--muted);white-space:nowrap}
.ncard .nbody{padding:0 14px 12px;border-top:1px solid var(--border);font-size:13.5px}
.ncard .nbody h4{margin:12px 0 4px;font-size:13px}
.ncard .nbody ul{padding-left:20px;margin:4px 0}
.ncard .nactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.analysis{margin-top:10px;border:1px solid var(--user-border);background:var(--accent-weak);border-radius:8px;padding:8px 12px}
.analysis .ah{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
.src{--cc:var(--c-slate)}.src.changelog{--cc:var(--c-blue)}.src.version{--cc:var(--c-green)}.src.cli{--cc:var(--c-violet)}.src.format{--cc:var(--c-orange)}
.chip.rel{--cc:var(--accent)}
/* tooltip */
#tip{position:fixed;z-index:20;max-width:320px;padding:6px 9px;border-radius:7px;background:var(--text);color:var(--bg);
  font-size:12px;line-height:1.4;white-space:pre-line;pointer-events:none;opacity:0;transform:translateY(2px);
  transition:opacity .12s,transform .12s;box-shadow:0 4px 14px rgba(0,0,0,.18);word-break:break-word}
#tip.show{opacity:1;transform:none}
#tip::after{content:"";position:absolute;left:var(--ax,50%);width:8px;height:8px;background:inherit;transform:translateX(-50%) rotate(45deg)}
#tip.above::after{bottom:-4px}
#tip.below::after{top:-4px}
.badge[data-tip],.dot[data-tip],.n[data-tip],.meta-line[data-tip]{cursor:help}
.item[data-tip],.chip[data-tip],.group-head[data-tip],.dlg-list div[data-tip]{cursor:pointer}
.mobile-nav{display:none}
@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .mobile-nav{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--panel)}

  body[data-view="left"] #left,body[data-view="mid"] #mid{display:flex}
  body[data-view="chat"] #chat{display:flex}
  .msg,.meta-line{padding:0 16px}
}
</style>
</head>

    </span>

<div id="toast" role="status"></div>
<div id="tip" role="tooltip"></div>

<script>
const TOKEN = "__TOKEN__";
const state = { projects: [], project: null, sessions: [], session: null, cwd: null, run: null, busy: false, repo: null };
const $ = id => document.getElementById(id);
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "X-Token": TOKEN, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function md(text) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text || ""));
  return `<p style="white-space:pre-wrap">${esc(text)}</p>`;
}
function ago(t) {
  const s = (Date.now() / 1000 - t);
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago"; if (s < 86400*30) return Math.floor(s/86400) + "d ago";
  return new Date(t*1000).toLocaleDateString();
}
const tilde = p => (p || "").replace(/^\/home\/[^/]+/, "~");
/* a modal <dialog> sits in the browser's top layer and makes the page behind it inert, so floating
   elements (toast, tooltip) must live inside the open dialog to be visible and clickable */
function hostFloating(el) {
  const host = [...document.querySelectorAll("dialog[open]")].pop() || document.body;
  if (el.parentNode !== host) host.appendChild(el);
}
function toast(msg) { const t = $("toast"); hostFloating(t); t.textContent = msg; t.classList.remove("action"); t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2500); }
function setView(v) { document.body.dataset.view = v; }
function toggleTheme() {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("theme", next);
}
if (store.get("theme")) document.documentElement.dataset.theme = store.get("theme");

/* ---------- tooltips: any element with data-tip="…" (works for dynamic content too) ---------- */
const tipEl = $("tip"); let tipTarget = null, tipTimer = null;
const tipAttr = s => esc(s).replace(/\n/g, "&#10;");  // for building data-tip="" inside template strings
function showTip(el, delay) {
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => {
    const text = el.dataset.tip;
    if (!text || !el.isConnected) return;
    tipTarget = el; hostFloating(tipEl); tipEl.textContent = text;
    tipEl.className = ""; tipEl.style.left = "0px"; tipEl.style.top = "0px";
    const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect(), m = 8;
    const above = r.top - t.height - m > 4;
    let left = Math.min(Math.max(4, r.left + r.width / 2 - t.width / 2), innerWidth - t.width - 4);
    tipEl.style.left = left + "px";
    tipEl.style.top = (above ? r.top - t.height - m : r.bottom + m) + "px";
    tipEl.style.setProperty("--ax", Math.min(Math.max(10, r.left + r.width / 2 - left), t.width - 10) + "px");
    tipEl.classList.add(above ? "above" : "below", "show");
    el.setAttribute("aria-describedby", "tip");
  }, delay);
}
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTarget) tipTarget.removeAttribute("aria-describedby");
  tipTarget = null; tipEl.classList.remove("show");
}
document.addEventListener("mouseover", e => {
  const el = e.target.closest?.("[data-tip],[title]");
  if (el?.hasAttribute("title")) { el.dataset.tip ??= el.title; el.removeAttribute("title"); }
  if (el === tipTarget) return;
  if (el) showTip(el, tipTarget ? 80 : 400); else hideTip();
});
document.addEventListener("focusin", e => { const el = e.target.closest?.("[data-tip]"); if (el && e.target.matches(":focus-visible")) showTip(el, 150); });
document.addEventListener("focusout", hideTip);
document.addEventListener("mousedown", hideTip);
document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
addEventListener("scroll", hideTip, true);
addEventListener("blur", hideTip);

/* ---------- projects ---------- */
state.meta = { groups: [], tags: [], folders: {}, colors: [] };
state.tagFilter = new Set(JSON.parse(store.get("tagFilter") || "[]"));
const collapsed = new Set(JSON.parse(store.get("collapsed") || "[]"));

async function loadProjects() {
  try {
    const [projects, meta] = await Promise.all([api("/api/projects"), api("/api/meta")]);
    state.projects = projects; state.meta = meta;
  } catch (e) { toast(e.message); return; }
  for (const id of [...state.tagFilter]) if (!state.meta.tags.some(t => t.id === id)) state.tagFilter.delete(id);
  renderProjects();
  if (state.project) { state.project = state.projects.find(p => p.key === state.project.key) || state.project; renderProjChips(); }
  else {
    const last = store.get("project"); const p = state.projects.find(x => x.key === last);
    if (p) selectProject(p.key, true);
  }
}
async function reloadMeta() {
  try { state.meta = await api("/api/meta"); } catch (e) { toast(e.message); return; }
  renderProjects(); renderProjChips();
  if (manageDlg.open) renderManage();
}
const folderOf = cwd => state.meta.folders[cwd] || { group: null, tags: [] };
const tagById = id => state.meta.tags.find(t => t.id === id);
const tagUses = id => Object.values(state.meta.folders).filter(f => f.tags.includes(id)).length;
const WT_BADGE_TIP = "This folder is a git worktree created by Claude Code (inside .claude/worktrees/)";
const MISSING_TIP = "This folder no longer exists on disk (deleted, moved or renamed).\nOld chats can still be read, but new chats can't run here.";
const chip = (t, extra = "", tip = `Tag: ${t.name}`) => `<span class="chip" style="--cc:var(--c-${t.color})" data-tip="${tipAttr(tip)}" ${extra}>${esc(t.name)}</span>`;

function renderTagFilter() {
  $("tagFilter").innerHTML = state.meta.tags.map(t =>
    `<span class="chip ${state.tagFilter.has(t.id) ? "on" : ""}" style="--cc:var(--c-${t.color})" onclick="toggleTagFilter(${t.id})" data-tip="${tipAttr(state.tagFilter.has(t.id) ? `Filtering by #${t.name} — click to remove this filter` : `Show only folders tagged #${t.name} (${tagUses(t.id)} folder${tagUses(t.id) === 1 ? "" : "s"})\nSelect several to require all of them`)}">#${esc(t.name)}</span>`).join("")
    + (state.tagFilter.size ? `<button class="ghost" style="font-size:11px" data-tip="Remove all tag filters" onclick="state.tagFilter.clear();saveTagFilter()">clear</button>` : "");
}
function toggleTagFilter(id) { state.tagFilter.has(id) ? state.tagFilter.delete(id) : state.tagFilter.add(id); saveTagFilter(); }
function saveTagFilter() { store.set("tagFilter", JSON.stringify([...state.tagFilter])); renderProjects(); }

function projectMatches(p) {
  const f = folderOf(p.cwd);
  for (const id of state.tagFilter) if (!f.tags.includes(id)) return false;
  const q = $("projSearch").value.trim().toLowerCase();
  if (!q) return true;
  const tagNames = f.tags.map(id => tagById(id)?.name.toLowerCase() || "");
  if (q.startsWith("#")) return tagNames.some(n => n.startsWith(q.slice(1)));
  return p.cwd.toLowerCase().includes(q) || tagNames.some(n => n.includes(q));
}
function projectItem(p) {
  const name = p.cwd.split("/").filter(Boolean).pop() || "/";
  const tags = folderOf(p.cwd).tags.map(tagById).filter(Boolean);
  const tip = `${p.cwd}\n${p.sessions} session${p.sessions === 1 ? "" : "s"} · last used ${new Date(p.mtime * 1000).toLocaleString()}\nClick to open · drag onto a group to move it`;
  return `<div class="item ${state.project?.key === p.key ? "active" : ""}" draggable="true" data-cwd="${esc(p.cwd)}" data-tip="${tipAttr(tip)}"
      onclick="selectProject('${esc(p.key)}')" ondragstart="dragStart(event)" ondragend="this.classList.remove('dragging')">
    <button class="ghost edit" data-tip="Set group and tags for this folder" aria-label="Edit group and tags" onclick='event.stopPropagation();openFolderDlg(${JSON.stringify(p.cwd)})'>🏷</button>
    <div class="t">${esc(name)}${p.isWorktree ? `<span class="badge wt" data-tip="${WT_BADGE_TIP}">worktree</span>` : ""}${p.exists ? "" : `<span class="badge gone" data-tip="${MISSING_TIP}">missing</span>`}</div>
    <div class="s">${esc(tilde(p.cwd))}</div>
    <div class="s">${p.sessions} session${p.sessions === 1 ? "" : "s"} · ${ago(p.mtime)}</div>
    ${tags.length ? `<div class="chips">${tags.map(t => chip(t)).join("")}</div>` : ""}</div>`;
}
function renderProjects() {
  renderTagFilter();
  const visible = state.projects.filter(projectMatches);
  const sections = [...state.meta.groups.map(g => ({ id: g.id, name: g.name, color: g.color })), { id: 0, name: "Ungrouped", color: "slate" }];
  const filtering = state.tagFilter.size || $("projSearch").value.trim();
  if (!state.meta.groups.length) {  // no groups yet: plain list

const wtDlg = $("wtDlg"); let wtPlan = null;
const WT_NAME_RE = /^[A-Za-z0-9._\/-]+$/;
const wtDefaultBranch = name => "worktree-" + name.replace(/\//g, "-");
function openWtDlg() {

  $("wtBranch").placeholder = name ? wtDefaultBranch(name) : "worktree-<name>";
  $("wtBranchDefault").textContent = name ? wtDefaultBranch(name) : "worktree-<name>";

  $("wtBaseField").hidden = state.repo.branches.includes(branch);

function wtReview(ev) {
  ev.preventDefault();
  const info = state.repo, name = $("wtName").value.trim();
  const branchInput = $("wtBranch").value.trim();
  const err = m => { $("wtFormErr").textContent = m; };
  if (!name) return err("Please enter a worktree name.");
  if (!WT_NAME_RE.test(name) || name.includes("..")) return err("Name can only contain letters, numbers, . _ - / (no \"..\").");
  const branch = branchInput || wtDefaultBranch(name);
  if (!WT_NAME_RE.test(branch) || branch.startsWith("-")) return err("Invalid branch name.");
  const path = info.root + "/.claude/worktrees/" + name;
  if (info.worktrees.some(w => w.path === path)) return err("A worktree with this name already exists.");

  const existing = info.branches.includes(branch);
  const base = existing ? "" : $("wtBase").value;
  const usedBy = info.worktrees.find(w => w.branch === branch);
  wtPlan = { name, branch: branchInput, base, path, startChat: $("wtStartChat").checked };

  const q = s => /^[\w.\/-]+$/.test(s) ? s : `'${s.replace(/'/g, "'\\''")}'`;
  const cmd = existing ? `git worktree add ${q(path)} ${q(branch)}`
                       : `git worktree add -b ${q(branch)} ${q(path)}${base ? " " + q(base) : ""}`;
  $("wtSummary").innerHTML = `
    <dt>Repository</dt><dd>${esc(tilde(info.root))}</dd>
    <dt>Folder</dt><dd>${esc(tilde(path))}</dd>
    <dt>Branch</dt><dd>${esc(branch)} ${existing ? "(existing)" : "(new)"}</dd>
    ${existing ? "" : `<dt>Based on</dt><dd>${esc(base || "HEAD" + (info.current ? " (" + info.current + ")" : ""))}</dd>`}
    <dt>Afterwards</dt><dd style="font-family:inherit">${wtPlan.startChat ? "Open a new chat in it" : "Nothing"}</dd>
    <dt>Command</dt><dd>${esc(cmd)}</dd>`;
  $("wtNotes").innerHTML = usedBy
    ? `<div class="note warn">⚠ Branch <b>${esc(branch)}</b> is already checked out at ${esc(tilde(usedBy.path))}. Git will refuse to check it out twice — go back and choose another branch.</div>`
    : `<div class="note">Your current folder and branch are not changed; the worktree is a separate checkout.</div>`;
  $("wtConfirmBtn").disabled = !!usedBy;
  wtShowStep("confirm"); $("wtConfirmBtn").focus();
}

/* ---- your messages: recognise shell (!) commands, slash commands, their output and pasted text ---- */
const stripAnsi = s => (s || "").replace(/\x1b\[[0-9;]*[A-Za-z]/g, "");
const tagText = (s, tag) => { const m = s.match(new RegExp(`<${tag}>([\\s\\S]*?)</${tag}>`)); return m ? m[1] : null; };
function classifyUserText(t) {
  const s = t.trim();
  if (s.startsWith("<bash-input>")) return { kind: "bash", cmd: (tagText(s, "bash-input") || "").trim() };
  if (/^<bash-std(out|err)>/.test(s)) return { kind: "output", out: stripAnsi(tagText(s, "bash-stdout")), err: stripAnsi(tagText(s, "bash-stderr")) };
  if (/^<command-(name|message)>/.test(s)) {
    const name = (tagText(s, "command-name") || tagText(s, "command-message") || "").trim(), args = (tagText(s, "command-args") || "").trim();
    return { kind: "slash", cmd: name.replace(/^\//, "") + (args ? " " + args : "") };
  }
  if (/^<local-command-std(out|err)>/.test(s)) return { kind: "output", out: stripAnsi(tagText(s, "local-command-stdout")), err: stripAnsi(tagText(s, "local-command-stderr")) };
  if (/^\[Request interrupted by user/.test(s)) return { kind: "notice", text: "You interrupted Claude here", tip: "You pressed Esc / Stop while Claude was working" };
  if (s.startsWith("<task-notification>")) return { kind: "notice", text: stripAnsi(tagText(s, "summary") || tagText(s, "status") || "update") };
  const sk = s.match(/^<([a-z0-9-]+)-command>/);
  if (sk) return { kind: "skill", cmd: sk[1], body: s.replace(/<\/?[a-z0-9-]+-command>/g, "").trim() };
  return { kind: "text", text: t };
}
const CMD_KIND = {
  bash: { ps: "$", label: "shell", tip: "Shell command you ran with ! in Claude Code.\nIt runs directly in your terminal, not through Claude." },
  slash: { ps: "/", label: "command", tip: "Slash command you ran in Claude Code" },
  skill: { ps: "/", label: "skill", tip: "Skill / custom command you ran. Expand to see the prompt it sent to Claude." },
};
function termEl(c) {
  const k = CMD_KIND[c.kind], box = document.createElement("div"); box.className = "term";
  box.innerHTML = `<div class="line"><span class="ps">${k.ps}</span><span class="c"></span><span class="kind" data-tip="${tipAttr(k.tip)}">${k.label}</span></div>`;
  box.querySelector(".c").textContent = c.cmd;
  if (c.body) {
    const d = document.createElement("details"); d.innerHTML = `<summary data-tip="The full prompt this command sent to Claude">Show expanded prompt</summary><pre></pre>`;
    d.querySelector("pre").textContent = c.body; box.appendChild(d);
  }

}
function addCmdOutput(p, container) {
  // attach to the command it belongs to: last terminal block in this message, else in the previous message
  const lastMsg = $("msgs").lastElementChild;
  const host = container || (lastMsg?.classList.contains("user") ? lastMsg : null);
  let box = host ? [...host.querySelectorAll(".term")].pop() : null;
  if (!box) {  // output without a visible command: show it on its own
    box = document.createElement("div"); box.className = "term";
    if (container) container.appendChild(box);
    else {
      const wrap = document.createElement("div"); wrap.className = "msg user";
      wrap.innerHTML = `<div class="role" data-tip="Output of a command you ran">Output</div>`; wrap.appendChild(box); $("msgs").appendChild(wrap);
    }
  }
  for (const [text, cls, tip] of [[p.out, "out", "Command output"], [p.err, "out err", "Error output (stderr)"]]) {
    if (!text || !text.trim()) continue;
    const pre = document.createElement("pre"); pre.className = cls; pre.dataset.tip = tip; pre.textContent = text.replace(/\n+$/, ""); box.appendChild(pre);

}
function fillBubble(el, text) {
  const re = /<pasted_content(?: id="[^"]*")?>\n?([\s\S]*?)\n?<\/pasted_content(?: id="[^"]*")?>/g;
  let last = 0, m;
  const addText = s => { s = s.replace(/^\n+|\n+$/g, ""); if (s) el.appendChild(document.createTextNode(s)); };
  while ((m = re.exec(text))) {
    addText(text.slice(last, m.index)); last = re.lastIndex;
    const lines = m[1].split("\n").length, d = document.createElement("details"); d.className = "paste";
    d.innerHTML = `<summary data-tip="Text you pasted into the message — click to show">📋 Pasted text · ${lines} line${lines === 1 ? "" : "s"}</summary><pre></pre>`;
    d.querySelector("pre").textContent = m[1]; el.appendChild(d);
  }
  addText(text.slice(last));
}

function renderMessage(role, blocks, ts = new Date().toISOString()) {
  const onlyResults = blocks.every(b => b.type === "tool_result");
  if (onlyResults) { const last = $("msgs").lastElementChild || $("msgs"); blocks.forEach(b => attachResult(b, last)); return; }
  const parts = role === "user" ? blocks.filter(b => b.type === "text").map(b => classifyUserText(b.text)) : [];
  if (parts.length && parts.length === blocks.length && parts.every(p => p.kind === "output" || p.kind === "notice")) {
    for (const p of parts) {
      if (p.kind === "output") addCmdOutput(p);
      else { const n = document.createElement("div"); n.className = "notice"; n.dataset.tip = p.tip || "A background task started earlier reported back"; n.textContent = p.tip ? "⏸ " + p.text : "⏱ Background task: " + p.text; $("msgs").appendChild(n); }
    }
    return;
  }
  const isCmd = parts.some(p => CMD_KIND[p.kind]);
  const wrap = document.createElement("div"); wrap.className = "msg " + role;
  wrap.innerHTML = `<div class="role">${role === "user" ? (isCmd ? "You · command" : "You") : "Claude"}</div>`;
  if (ts) wrap.querySelector(".role").dataset.tip = (role === "user" ? "Sent " : "Replied ") + new Date(ts).toLocaleString();
  let pi = 0;
  for (const b of blocks) {
    if (b.type === "text") {
      if (role === "user") {
        const p = parts[pi++];
        if (CMD_KIND[p.kind]) wrap.appendChild(termEl(p));
        else if (p.kind === "output") addCmdOutput(p, wrap);
        else if (p.kind === "text") { const el = document.createElement("div"); el.className = "bubble"; fillBubble(el, p.text); wrap.appendChild(el); }
        continue;
      }
      const el = document.createElement("div"); el.className = "md"; el.innerHTML = md(b.text);
      wrap.appendChild(el);
    } else if (b.type === "thinking") {
      const d = document.createElement("details"); d.className = "think";
      d.innerHTML = `<summary data-tip="Claude's internal reasoning before answering — click to show">Thinking</summary><div></div>`; d.querySelector("div").textContent = b.text; wrap.appendChild(d);
    } else if (b.type === "tool_use") wrap.appendChild(toolEl(b));
    else if (b.type === "tool_result") attachResult(b, wrap);
  }
  // merge consecutive assistant chunks visually
  const prev = $("msgs").lastElementChild;
  if (role === "assistant" && prev?.classList.contains("assistant") && !prev.classList.contains("live")) {
    wrap.querySelector(".role").remove(); [...wrap.children].forEach(c => prev.appendChild(c));
  } else $("msgs").appendChild(wrap);
}

/* startup info from the stream-json system/init event: version, model, mode, MCP servers, plugins.
   plugin_errors entries carry the failing directory in `path` since Claude Code 2.1.283. */
function showInitInfo(ev) {
  const mcp = ev.mcp_servers || [];
  // "pending" = still connecting (its tools may arrive on a later turn); anything else not connected is a problem
  const ok = mcp.filter(m => m.status === "connected"), bad = mcp.filter(m => !["connected", "pending"].includes(m.status));
  const plugins = ev.plugins || [], perrs = ev.plugin_errors || [];
  const line = document.createElement("div"); line.className = "meta-line";
  line.textContent = [ev.claude_code_version && "Claude Code " + ev.claude_code_version, ev.model, ev.permissionMode,
    mcp.length && `MCP ${ok.length}/${mcp.length} connected`, plugins.length && `${plugins.length} plugin${plugins.length === 1 ? "" : "s"}`]
    .filter(Boolean).join(" · ");
  line.dataset.tip = `Session started\nClaude Code: ${ev.claude_code_version || "?"}\nModel: ${ev.model || "?"}\nPermission mode: ${ev.permissionMode || "?"}` +
    (mcp.length ? "\n\nMCP servers:\n" + mcp.map(m => `${m.status === "connected" ? "✓" : m.status === "pending" ? "…" : "✗"} ${m.name} (${m.status === "pending" ? "still connecting" : m.status})`).join("\n") : "") +
    (plugins.length ? "\n\nPlugins:\n" + plugins.map(x => `• ${x.name}${x.version ? " " + x.version : ""}`).join("\n") : "") +
    (ev.tools ? `\n\nTools available: ${ev.tools.length}` : "");
  $("msgs").appendChild(line);
  const warns = [
    ...bad.map(m => `MCP server “${m.name}” ${m.status === "needs-auth" ? "needs authentication" : m.status} — its tools aren't available in this reply`),
    ...perrs.map(e => `Plugin failed to load${e.path ? ` from ${tilde(e.path)}` : ""}${e.name ? ` (${e.name})` : ""}: ${e.error || e.message || e.reason || JSON.stringify(e)}`),
  ];
  for (const w of warns) {
    const d = document.createElement("div"); d.className = "meta-line"; d.style.color = "var(--warn)"; d.textContent = "⚠ " + w;
    d.dataset.tip = w.startsWith("MCP") ? "Fix it in your terminal with /mcp (or `claude mcp`), then send again" : "Check the plugin directory shown, or run /plugin in your terminal";
    $("msgs").appendChild(d);
  }
  scrollDown();
}

async function send() {
  const prompt = $("prompt").value.trim();
  if (!prompt || state.busy || !state.cwd) return;
  if ($("msgs").querySelector(".empty")) $("msgs").innerHTML = "";
  $("prompt").value = ""; $("prompt").style.height = "";
  renderMessage("user", [{ type: "text", text: prompt }]); scrollDown(true);
  setBusy(true, "Starting Claude…");

  let live = null; // live streaming element for the in-progress assistant message
  const ensureLive = () => {
    if (!live) { live = document.createElement("div"); live.className = "msg assistant live"; live.innerHTML = '<div class="role">Claude</div><div class="md"></div>'; live._text = ""; $("msgs").appendChild(live); }
    return live;
  };
  const handle = ev => {
    switch (ev.type) {
      case "ui_run": state.run = ev.run; break;
      case "system":
        if (ev.subtype === "init" && ev.session_id) {
          if (!state.session) { state.session = ev.session_id; setChatHeader("New chat", state.cwd, ev.session_id); }
          showInitInfo(ev);
          setBusy(true, "Thinking…");
        }
        break;
      case "stream_event": {
        const e = ev.event || {};
        if (e.type === "content_block_start" && e.content_block?.type === "tool_use") setBusy(true, "Running " + e.content_block.name + "…");
        if (e.type === "content_block_delta" && e.delta?.type === "text_delta") {
          const l = ensureLive(); l._text += e.delta.text; l.querySelector(".md").innerHTML = md(l._text); setBusy(true, "Writing…"); scrollDown();
        }
        break;
      }
      case "assistant":
        if (live) { live.remove(); live = null; }
        renderMessage("assistant", normalizeBlocks(ev.message?.content)); scrollDown(); break;
      case "user": {
        const blocks = normalizeBlocks(ev.message?.content).filter(b => b.type === "tool_result");
        if (blocks.length) { renderMessage("user", blocks); setBusy(true, "Thinking…"); }
        break;
      }
      case "result": {
        const secs = ev.duration_ms ? (ev.duration_ms / 1000).toFixed(1) + "s" : "";
        const cost = ev.total_cost_usd != null ? " · $" + ev.total_cost_usd.toFixed(4) : "";
        const line = document.createElement("div"); line.className = "meta-line";
        line.textContent = (ev.is_error ? "⚠ " + (ev.result || ev.subtype) + " · " : "✓ ") + secs + cost + (ev.num_turns ? ` · ${ev.num_turns} turns` : "");
        line.dataset.tip = `${ev.is_error ? "The reply ended with an error" : "Reply finished"}\nTime: ${secs || "?"}` +
          (ev.total_cost_usd != null ? `\nCost of this reply: $${ev.total_cost_usd.toFixed(4)}` : "") +
          (ev.num_turns ? `\nTurns: ${ev.num_turns} (one per model call, including tool use)` : "");
        $("msgs").appendChild(line);
        if (ev.permission_denials?.length) {
          const d = document.createElement("div"); d.className = "meta-line"; d.style.color = "var(--warn)";
          d.dataset.tip = "Denied: " + ev.permission_denials.map(x => x.tool_name).join(", ");
          d.textContent = `${ev.permission_denials.length} tool call(s) were denied by permission mode — switch Mode (e.g. acceptEdits / bypassPermissions) and ask again.`;
          $("msgs").appendChild(d);
        }
        break;
      }
      case "ui_error": {
        const d = document.createElement("div"); d.className = "meta-line errbox"; d.textContent = `claude exited (${ev.code}): ${ev.text}`; d.dataset.tip = "The claude process ended with an error. The message above may be incomplete.";
        $("msgs").appendChild(d); break;
      }
    }
  };

  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify({ cwd: state.cwd, sessionId: state.session, prompt, permissionMode: $("permMode").value, model: $("model").value, effort: $("effort").value }) });
    if (!r.ok) throw new Error((await r.json()).error);
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n")) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 1); if (line.trim()) try { handle(JSON.parse(line)); } catch (e) { console.warn(e, line); } }
    }
  } catch (e) {
    const d = document.createElement("div"); d.className = "meta-line errbox"; d.textContent = e.message; $("msgs").appendChild(d);
  }
  if (live) live.classList.remove("live");
  state.run = null; setBusy(false); scrollDown();
  refreshAfterRun();
}
function normalizeBlocks(content) {
  if (typeof content === "string") return [{ type: "text", text: content }];
  return (content || []).map(b => {
    if (b.type === "tool_result") {
      let t = b.content; if (Array.isArray(t)) t = t.map(x => x.text || "").join("\n");
      return { type: "tool_result", id: b.tool_use_id, text: t, isError: b.is_error };
    }
    if (b.type === "thinking") return { type: "thinking", text: b.thinking };
    return b;
  }).filter(b => b.type !== "thinking" || b.text);
}
async function refreshAfterRun() {
  await loadProjects();
  const p = state.projects.find(x => x.cwd === state.cwd);
  if (p) { if (state.project?.key !== p.key) await selectProject(p.key, true); else { state.sessions = await api("/api/sessions?project=" + encodeURIComponent(p.key)); renderSessions(); } }
  const s = state.sessions.find(x => x.id === state.session); if (s) $("chatTitle").textContent = s.title;
}

  const cmd = `cd '${state.cwd.replace(/'/g, "'\\''")}' && claude --resume ${state.session}`;
  navigator.clipboard.writeText(cmd).then(() => toast("Copied: " + cmd), () => prompt("Copy:", cmd));

/* ---------- news inbox: Claude Code changes kept in workbench.db ---------- */

const SRC = {
  changelog: ["changelog", "New Claude Code version from the official changelog"],

async function loadNews() {

function applyNews(r) {
  Object.assign(news, { items: r.items, unread: r.unread, lastCheck: r.lastCheck, checking: r.checking, error: r.error });
  const alive = new Set(r.items.map(n => n.id));

  $("newsBatch").hidden = !n;
  $("newsDelSel").textContent = `🗑 Delete selected (${n})`;
  $("newsDelAll").textContent = `🗑 Delete all (${list.length})`; $("newsDelAll").disabled = !list.length;
  const tab = { all: "", unread: " unread", relevant: " 🔧 dashboard" }[news.filter];
  $("newsDelAll").dataset.tip = `Delete all ${list.length}${tab} update${list.length === 1 ? "" : "s"} shown in this tab (you can undo right after)`;
}
async function batchRead(read) { const ids = selectedVisible(); if (ids.length) { await setRead(ids, read); } }

async function deleteNotices(ids, allInTab) {
  if (!ids.length) return;
  const what = ids.length === 1 ? "this update" : allInTab ? `ALL ${ids.length} updates in this tab` : `${ids.length} selected updates`;
  if (ids.length > 1 && !confirm(`Delete ${what}?\n\nThey won't come back on later checks. You can undo right after.`)) return;
  try {
    await api("/api/notice", { ids, delete: true });
    ids.forEach(i => { news.open.delete(i); news.selected.delete(i); });
    applyNews(await api("/api/notices"));
    toastAction(`Deleted ${ids.length === 1 ? "1 update" : ids.length + " updates"}`, "Undo", async () => {
      await api("/api/notice", { ids, restore: true }); applyNews(await api("/api/notices")); toast("Restored");
    });
  } catch (e) { toast(e.message); }
}
/* toast with one action button (e.g. Undo); stays 7s */
function toastAction(msg, label, fn) {
  const t = $("toast"); clearTimeout(t._h); hostFloating(t);
  t.innerHTML = ""; t.append(Object.assign(document.createElement("span"), { textContent: msg }));
  const b = Object.assign(document.createElement("button"), { textContent: label });
  b.onclick = () => { t.classList.remove("show", "action"); fn(); };
  t.append(b); t.classList.add("show", "action");
  t._h = setTimeout(() => t.classList.remove("show", "action"), 7000);
}
async function analyzeNotice(id) {
  const btn = $("an-" + id); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Asking Claude…';
  try { await api("/api/notice/analyze", { id }); applyNews(await api("/api/notices")); }
  catch (e) { toast("Claude failed: " + e.message); btn.disabled = false; btn.textContent = "✳ Ask Claude about impact"; }
}
async function checkNews() {
  const btn = $("newsCheckBtn"); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Checking…';
  try {
    const r = await api("/api/notices/check", {});
    applyNews(r);
    toast(r.busy ? "A check is already running" : r.added ? `${r.added} new update${r.added === 1 ? "" : "s"}` : "No new updates");
  } catch (e) { toast(e.message); }
  btn.disabled = false; btn.textContent = "↻ Check now";
}
